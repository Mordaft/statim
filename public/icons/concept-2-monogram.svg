<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-grad" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="60%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#06090e"/>
    </radialGradient>

    <!-- Vibrant S-Curve Gradient -->
    <linearGradient id="s-grad" x1="20%" y1="15%" x2="80%" y2="85%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="35%" stop-color="#1f6feb"/>
      <stop offset="70%" stop-color="#79c0ff"/>
      <stop offset="100%" stop-color="#2ea043"/>
    </linearGradient>

    <!-- Node Glow Gradients -->
    <radialGradient id="node-glow-top" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#79c0ff" stop-opacity="1"/>
      <stop offset="50%" stop-color="#1f6feb" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#1f6feb" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="node-glow-bot" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#56d364" stop-opacity="1"/>
      <stop offset="50%" stop-color="#2ea043" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#2ea043" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop Shadows for 3D depth -->
    <filter id="glow-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Base App Background (Maskable Safe) -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)"/>

  <!-- Subtle Ambient Radial Glow in center -->
  <circle cx="256" cy="256" r="160" fill="#1f6feb" opacity="0.12" filter="url(#glow-filter)"/>

  <!-- Graphic Elements Group centered in safe area -->
  <g filter="url(#soft-shadow)">
    <!-- Outer P2P orbital signal arcs -->
    <path d="M 320 128 A 64 64 0 0 1 384 192" fill="none" stroke="#58a6ff" stroke-width="8" stroke-linecap="round" opacity="0.4"/>
    <path d="M 192 384 A 64 64 0 0 1 128 320" fill="none" stroke="#56d364" stroke-width="8" stroke-linecap="round" opacity="0.4"/>

    <!-- Dynamic S-Channel Ribbon (P2P Mesh data link) -->
    <!-- Top peer node (330, 160) sweeps back left (190, 160), down through center (256, 256), swings right (322, 352), into bottom node (182, 352) -->
    <path d="M 330 160 
             C 240 145, 175 190, 175 240
             C 175 285, 230 295, 256 305
             C 300 320, 337 340, 337 385
             C 337 435, 260 455, 182 435" 
          fill="none" 
          stroke="url(#s-grad)" 
          stroke-width="36" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          filter="url(#glow-filter)"/>

    <!-- Secondary complementary data link wave completing the S-monogram -->
    <path d="M 182 352
             C 272 367, 337 322, 337 272
             C 337 227, 282 217, 256 207
             C 212 192, 175 172, 175 127
             C 175 77, 252 57, 330 77" 
          fill="none" 
          stroke="#79c0ff" 
          stroke-width="12" 
          stroke-linecap="round" 
          opacity="0.35"/>

    <!-- Top Peer Node (Initiator / Confluence Bridge) -->
    <circle cx="330" cy="160" r="38" fill="url(#node-glow-top)"/>
    <circle cx="330" cy="160" r="22" fill="#0d1117" stroke="#58a6ff" stroke-width="8"/>
    <circle cx="330" cy="160" r="10" fill="#79c0ff"/>

    <!-- Bottom Peer Node (Receiver / Local Edge Peer) -->
    <circle cx="182" cy="352" r="38" fill="url(#node-glow-bot)"/>
    <circle cx="182" cy="352" r="22" fill="#0d1117" stroke="#2ea043" stroke-width="8"/>
    <circle cx="182" cy="352" r="10" fill="#56d364"/>

    <!-- Real-time Packet Pulses travelling on the mesh -->
    <circle cx="230" cy="225" r="7" fill="#ffffff" opacity="0.9"/>
    <circle cx="282" cy="287" r="7" fill="#ffffff" opacity="0.9"/>
  </g>
</svg>
