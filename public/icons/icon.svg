<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    
    <!-- Brand Cyan-to-Deep-Navy Gradient from original artwork -->
    <linearGradient id="statim-gradient" x1="90%" y1="0%" x2="10%" y2="100%">
      <stop offset="0%" stop-color="#00daf3"/>
      <stop offset="22%" stop-color="#00b4d8"/>
      <stop offset="55%" stop-color="#026cb6"/>
      <stop offset="82%" stop-color="#09285b"/>
      <stop offset="100%" stop-color="#07193b"/>
    </linearGradient>
    <radialGradient id="bg-glow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#151b23"/>
      <stop offset="60%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#05080c"/>
    </radialGradient>
    <filter id="icon-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Maskable PWA Safe Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg-glow)"/>

  <!-- Subtle ambient central cyan glow -->
  <circle cx="256" cy="270" r="140" fill="#00daf3" opacity="0.08" filter="blur(20px)"/>

  <!-- Centered Padlock & Lightning Bolt Emblem -->
  <!-- Scaled slightly to fit within 40% maskable safe circle (diameter ~360px) -->
  <g transform="translate(256 256) scale(0.92) translate(-256 -260)" filter="url(#icon-shadow)" fill="url(#statim-gradient)">
    <path fill-rule="evenodd" d="
      M 164 202
      L 164 160
      A 92 92 0 0 1 348 160
      L 348 202
      L 376 202
      L 376 226
      C 368 214 354 204 338 202
      L 312 202
      L 312 160
      A 56 56 0 0 0 200 160
      L 200 202
      L 174 202
      C 158 204 144 214 136 226
      L 136 202
      Z"/>
    <path fill-rule="evenodd" d="
      M 256 198
      A 120 120 0 1 1 255.9 198
      Z

      M 259 238
      A 80 80 0 0 0 230 394
      L 256 346
      L 200 346
      Z

      M 293 247
      L 254 318
      L 312 318
      L 268 397
      A 80 80 0 0 0 293 247
      Z"/>
  </g>
</svg>